name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o rotate-linux-amd64 rotate.go
          tar -czf rotate-linux-amd64.tar.gz rotate-linux-amd64

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o rotate-linux-arm64 rotate.go
          tar -czf rotate-linux-arm64.tar.gz rotate-linux-arm64

          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -o rotate-darwin-amd64 rotate.go
          tar -czf rotate-darwin-amd64.tar.gz rotate-darwin-amd64

          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o rotate-darwin-arm64 rotate.go
          tar -czf rotate-darwin-arm64.tar.gz rotate-darwin-arm64

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -o rotate-windows-amd64.exe rotate.go
          zip rotate-windows-amd64.zip rotate-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rotate-linux-amd64.tar.gz
            rotate-linux-arm64.tar.gz
            rotate-darwin-amd64.tar.gz
            rotate-darwin-arm64.tar.gz
            rotate-windows-amd64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
